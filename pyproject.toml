[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-ai-trading-platform"
version = "0.1.0"
description = "AI quantitative research, paper trading and risk platform"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "eval-type-backport>=0.2,<1", "anthropic>=0.39,<1", "httpx>=0.27,<1"]

[project.scripts]
pramana = "quant_ai.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/quant_ai/api/app.py" = ["B008"]
