name: Assemble reviewed bridge tree
on:
  push:
    branches: [ci/source-snapshot-47e2d5c-20260918]
    paths:
      - .github/workflows/development-bridge-tree.yml
      - development-transfer/**
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47e2d5c28370a7bdab75c08ff4aca2c0935ffdf3
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transfer
          persist-credentials: false
      - name: Verify exact source tree and create immutable objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          root=Path('source'); transfer=Path('transfer/development-transfer')
          repo='PawSpaceIND/quant-ai-trading-platform'
          assert os.environ['GITHUB_REPOSITORY']==repo
          def git(*args):
              return subprocess.check_output(['git',*args],cwd=root,text=True).strip()
          assert git('rev-parse','HEAD')=='47e2d5c28370a7bdab75c08ff4aca2c0935ffdf3'
          patch=(transfer/'bridge-routing.patch').resolve()
          subprocess.run(['git','apply','--check',str(patch)],cwd=root,check=True)
          subprocess.run(['git','apply','--index',str(patch)],cwd=root,check=True)
          copies={
              'institutional_runtime.py.txt':'src/quant_ai/agents/institutional_runtime.py',
              'test_institutional_swarm_bridge.py.txt':'tests/test_institutional_swarm_bridge.py',
              'INSTITUTIONAL_SWARM_BRIDGE.md.txt':'docs/INSTITUTIONAL_SWARM_BRIDGE.md'}
          for name,dest in copies.items():
              path=root/dest
              assert not path.exists()
              path.write_bytes((transfer/name).read_bytes())
          note='\n### M03 immediate operating-path bridge (partial)\n\nAn explicitly selected `InstitutionalRuntimeInputs` configuration now connects the\nexisting synchronous/asynchronous swarm route and actual runner factory to the\ninstitutional coordinator, programme journal, shared-risk admission and accounting.\nIt requires bound NSE cash, immediate execution and supplied institutional inputs;\nmissing inputs cannot fall back to direct submission. Default deployment selection\nis unchanged. Trace provenance and final daemon operating checks are retained.\nAutomatic scheduled execution/recovery, source qualification, M01 capacity release\nand target-host acceptance remain open. See `INSTITUTIONAL_SWARM_BRIDGE.md`; no whole\nmilestone is marked complete by the synthetic bridge tests.\n'
          plan=root/'docs/REMAINING_DELIVERY_PLAN.md'
          plan.write_text(plan.read_text()+note)
          allowed=set(copies.values())|{'docs/REMAINING_DELIVERY_PLAN.md',
              'src/quant_ai/agents/swarm_runtime.py','src/quant_ai/agents/traded_runtime.py',
              'src/quant_ai/daemon.py','src/quant_ai/execution/institutional.py',
              'src/quant_ai/governance/runtime_manifest.py'}
          subprocess.run(['git','add','--',*sorted(allowed)],cwd=root,check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          subprocess.run(['git','diff','--cached','--check'],cwd=root,check=True)
          expected='dbe56c8f590ca1bc9e78992c2f9ae2c4aa0c5a80'
          actual=git('write-tree')
          print('LOCAL_ASSEMBLED_TREE',actual,flush=True)
          assert actual==expected,'Source transfer differs from locally tested tree'
          def post(suffix,payload):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+suffix,
                  data=json.dumps(payload).encode(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          entries=[]
          for path in sorted(allowed):
              content=(root/path).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              blob=post('blobs',{'content':content.decode('utf-8'),'encoding':'utf-8'})
              assert blob['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=post('trees',{'base_tree':'9222395bf8885a3f08555ec2c4473efae62ed921','tree':entries})
          assert tree['sha']==expected
          print('VERIFIED_REMOTE_TREE',tree['sha'],'FILES',len(entries),flush=True)
          print('No commit or branch ref was created or updated. No product code was executed.',flush=True)
          PY
