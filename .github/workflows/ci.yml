name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q

  deployment-portability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    env:
      TRADING_LIVE_MONEY_ACTIVE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Test deployment script with system Bash and stubbed Docker
        run: |
          mkdir -p "$RUNNER_TEMP/system-shell"
          ln -s /bin/bash "$RUNNER_TEMP/system-shell/bash"
          export PATH="$RUNNER_TEMP/system-shell:$PATH"
          bash --version
          /bin/bash -n scripts/deploy_pilot_host.sh
          python -m pytest -q tests/test_deploy_pilot_host.py tests/test_deploy_portability.py --junitxml="$RUNNER_TEMP/deployment-portability.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-portability-${{ matrix.os }}
          path: ${{ runner.temp }}/deployment-portability.xml
          if-no-files-found: error

  institutional-risk-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TRADING_LIVE_MONEY_ACTIVE: "false"
      PYTHONPATH: src:tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      # Blocking: no skip, xfail, continue-on-error, or success-on-failure wrapper.
      - name: Institutional risk acceptance
        run: python -m pytest -q acceptance/test_institutional_edge_authority.py --junitxml="$RUNNER_TEMP/institutional-risk.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institutional-risk-acceptance
          path: ${{ runner.temp }}/institutional-risk.xml
          if-no-files-found: error

  pilot-preflight-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TRADING_LIVE_MONEY_ACTIVE: "false"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      # Open requirements remain real failures, not xfail/skip or a successful wrapper.
      - name: Preflight input and report acceptance
        run: python -m pytest -q acceptance/test_risk_preflight_input_boundary.py --junitxml="$RUNNER_TEMP/pilot-preflight-acceptance.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-preflight-acceptance
          path: ${{ runner.temp }}/pilot-preflight-acceptance.xml
          if-no-files-found: error

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pramana-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/pramana-ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test


  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/pramana-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/pramana-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-browser-verification
          path: apps/pramana-ui/test-results
          if-no-files-found: warn

  cloud-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/pramana-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --prefix apps/pramana-ui
      - run: node --test deploy/cloudflare/worker.test.mjs
      - run: python scripts/build_cloud_web.py

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deployment images and verify isolated paper workspace
        env:
          PRAMANA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify_pilot_containers.py --output /tmp/pilot-container-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-container-verification
          path: /tmp/pilot-container-verification.json
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the full commit history, not only the checked-out tip

      # Runs before any dependency install so that a leaked secret fails fast and so
      # that node_modules / site-packages never enter the scan surface.
      #
      # This uses the gitleaks CLI (MIT licensed, no key) instead of
      # gitleaks/gitleaks-action, which requires a GITLEAKS_LICENSE for
      # organization-owned repositories. That action was previously skipped whenever
      # the secret was unset, which left this public repository with no secret
      # scanning at all while CI still reported green. The CLI has no such
      # requirement, so this step always runs and always blocks.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from that release's
          # published gitleaks_8.30.1_checksums.txt. Bump both values together.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location \
            --output "$tmp/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Verify before extracting; never pipe a download into a shell.
          (cd "$tmp" && echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -)
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          "$tmp/gitleaks" version
          # The full history is a superset of the pushed / pull-request commit range,
          # and unlike a base..head diff it can never silently scan nothing (first
          # push of a branch, force-push, or a zeroed github.event.before). It also
          # catches a secret that was committed and later deleted.
          # The wrapper retains both full-history and working-tree scans, checks that
          # a synthetic finding still blocks, and publishes locations without secrets.
          python3 scripts/scan_repository_secrets.py --scanner "$tmp/gitleaks" \
            --report-directory "$RUNNER_TEMP/pramana-secret-scan"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-location-summary
          path: ${{ runner.temp }}/pramana-secret-scan/secret-scan-summary.json
          if-no-files-found: warn

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,pilot]'
      - run: pip install pip-audit
      - name: Python dependency audit (pip-audit)
        run: |
          set -euo pipefail
          # Blocking. Exactly two findings are accepted, by ID, each with the reason
          # it is accepted and the condition that retires it. Any third vulnerability
          # fails this job. Do not add --strict: this project is not published to
          # PyPI, so pip-audit always reports itself as a skipped dependency.
          #
          # PYSEC-2020-25 (CVE-2020-35678) - autobahn 19.11.2, redirect header
          #   injection in the WebSocket client. Fixed in autobahn 20.12.3.
          #   Accepted: kiteconnect 5.2.2 requires autobahn[twisted]==19.11.2 as an
          #   exact pin, so autobahn cannot be raised without dropping the Zerodha
          #   client that the 'pilot' extra exists to provide. Reachable only via the
          #   fixed first-party wss:// Kite endpoint used by ZerodhaKiteTicker.
          #   Remove when: pykiteconnect ships a release that relaxes that pin, or
          #   the pilot extra stops depending on kiteconnect.
          #
          # PYSEC-2026-3447 (CVE-2026-59890) - setuptools 79.0.1, MANIFEST.in exclude
          #   rules bypassed by Unicode NFD/NFC file names when building an sdist on
          #   macOS APFS/HFS+. Fixed in setuptools 83.0.0.
          #   Accepted: setuptools is not a dependency of this project, it is
          #   preinstalled in the actions/setup-python environment, and nothing here
          #   builds an sdist, ships a MANIFEST.in, or runs on macOS.
          #   Remove when: the runner image ships setuptools >= 83.0.0. The ignore is
          #   inert in the meantime - an ID that matches nothing is not an error.
          pip-audit \
            --ignore-vuln PYSEC-2020-25 \
            --ignore-vuln PYSEC-2026-3447
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/pramana-ui/package-lock.json
      - name: UI dependency audit (npm audit)
        working-directory: apps/pramana-ui
        run: |
          npm ci
          npm audit --audit-level=high
