# Run: docker compose --env-file ../.env -f docker-compose.yml up -d --build
x-shared: &shared
  PRAMANA_TENANT_ID: ghost
  PRAMANA_LEDGER_PATH: /data/pramana.db
  PRAMANA_PROOF_DIR: /data/xai
  PRAMANA_HALT_FILE: /data/PRAMANA_HALT
  PRAMANA_MARKET_SNAPSHOT: /data/market-monitor.json
  TRADING_LIVE_MONEY_ACTIVE: "false"
# Container logs are capped so a chatty week cannot fill a small instance's disk and take
# the engine down with it. The engine's own alert log and proofs live in the volume.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
services:
  pramana-ghost:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      <<: *shared
      PRAMANA_PILOT_MODE: "true"
      # Explicit rollout; unset stays legacy. Empty/unknown modes refuse in the builder.
      PRAMANA_ORDER_IDENTITY_MODE: ${PRAMANA_ORDER_IDENTITY_MODE-legacy_cash}
      PRAMANA_OMS_DB: ${PRAMANA_OMS_DB:-}
      PRAMANA_RELEASE_REVISION: ${PRAMANA_RELEASE_REVISION:-}
      PRAMANA_GHOST_LOG: /data/pramana-ghost.log
      PRAMANA_FOUNDER_DIRECTIVES_FILE: /app/directives.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:?required}
      # Missing/expired tokens reach the guarded boot and durable pre-open alert path.
      ZERODHA_ACCESS_TOKEN: ${ZERODHA_ACCESS_TOKEN:-}
      PRAMANA_ZERODHA_TOKEN_ISSUED_AT: ${PRAMANA_ZERODHA_TOKEN_ISSUED_AT:-}
      PRAMANA_ZERODHA_USER_ID: ${PRAMANA_ZERODHA_USER_ID:-}
      PRAMANA_ZERODHA_TOKENS_JSON: ${PRAMANA_ZERODHA_TOKENS_JSON:?required}
      PRAMANA_ZERODHA_SYMBOLS_JSON: ${PRAMANA_ZERODHA_SYMBOLS_JSON:?required}
      PRAMANA_TARGET_SYMBOL: ${PRAMANA_TARGET_SYMBOL:-INFY}
      PRAMANA_TARGET_MARKET: INDIA
      PRAMANA_TARGET_ASSET_CLASS: EQUITY
      PRAMANA_TARGET_CURRENCY: INR
      PRAMANA_TARGET_EXCHANGE: NSE
      PRAMANA_IBKR_ENABLED: "false"
      PRAMANA_NEWS_RSS_URLS: ${PRAMANA_NEWS_RSS_URLS:-}
      # Operator-asserted names a symbol's news is also published under ("Infosys" for
      # INFY). Unset means only the symbol itself matches, as before. An unparseable or
      # out-of-bounds map stops the daemon at boot rather than attributing nothing.
      PRAMANA_NEWS_SYMBOL_ALIASES_JSON: ${PRAMANA_NEWS_SYMBOL_ALIASES_JSON:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      # India context beside FRED's core series: India VIX from Yahoo (^INDIAVIX daily bars)
      # and NSE's provisional daily FII/DII net flows. Opt-in; "none" leaves each out.
      PRAMANA_INDIA_VIX_PROVIDER: ${PRAMANA_INDIA_VIX_PROVIDER:-none}
      PRAMANA_INDIA_FLOWS_PROVIDER: ${PRAMANA_INDIA_FLOWS_PROVIDER:-none}
      # Second candidate in the research comparison only. The engine never calls OpenAI:
      # `quant_ai.research` is offline by construction and touches no broker credential,
      # no ledger and no cadence. Optional - with it unset, `research_extensions compare`
      # refuses the paid call and records `credential_missing` rather than guessing.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PRAMANA_FUNDAMENTALS_PROVIDER: ${PRAMANA_FUNDAMENTALS_PROVIDER:-yahoo}
      PRAMANA_AI_DAILY_CALL_LIMIT: ${PRAMANA_AI_DAILY_CALL_LIMIT:-500}
      PRAMANA_AI_DAILY_TOKEN_LIMIT: ${PRAMANA_AI_DAILY_TOKEN_LIMIT:-2000000}
      PRAMANA_AI_BUDGET_DB: /data/ai-budget.sqlite
      # Per-response allowance only; legacy default and daily spend limits are unchanged.
      PRAMANA_CONSENSUS_MAX_TOKENS: ${PRAMANA_CONSENSUS_MAX_TOKENS:-1200}
      PRAMANA_DAILY_HISTORY_PROVIDER: ${PRAMANA_DAILY_HISTORY_PROVIDER:-yahoo}
      # Mandatory entry gates; provider absence must never mean permission to trade.
      PRAMANA_REQUIRE_BOOK_RISK_GATES: "true"
      PRAMANA_BOOK_RISK_HISTORY: ${PRAMANA_BOOK_RISK_HISTORY:-daily}
      PRAMANA_SECTOR_MAP_JSON: ${PRAMANA_SECTOR_MAP_JSON:-}
      PRAMANA_SECTOR_MAP_FILE: /app/pilot-sector-map.json
      PRAMANA_DECISION_QUALITY_REPORT: /data/decision-quality.json
      PRAMANA_POST_MORTEM_DIR: /data/post-mortems
      PRAMANA_HOLIDAYS_JSON: ${PRAMANA_HOLIDAYS_JSON:-}
      # Every dispatched alert is appended to this file in the shared volume, so an alert
      # outlives the container that `up -d --build` replaces. Telegram is optional push
      # delivery on top; set both values in .env to enable it.
      PRAMANA_ALERT_LOG: /data/alerts.jsonl
      PRAMANA_TELEGRAM_BOT_TOKEN: ${PRAMANA_TELEGRAM_BOT_TOKEN:-}
      PRAMANA_TELEGRAM_CHAT_ID: ${PRAMANA_TELEGRAM_CHAT_ID:-}
    volumes:
      - pramana-data:/data
      - type: bind
        source: ${PRAMANA_SECTOR_MAP_HOST_FILE:-./pilot-sector-map.example.json}
        target: /app/pilot-sector-map.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PRAMANA_DIRECTIVES_HOST_FILE:-./founder-directives.example.json}
        target: /app/directives.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "/app/scripts/pilot_ops.py", "health", "--database", "/data/pramana.db", "--tenant", "ghost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 45s
    # Sized for a small (2 GB) Lightsail instance and matched to the systemd unit's
    # MemoryMax. Caps are not reservations; the four services do not all peak together.
    mem_limit: 1g
    logging: *logging
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    restart: unless-stopped
    environment:
      <<: *shared
      PRAMANA_CONSOLE_DB: /data/pilot-console.sqlite
      # Same selected OMS path as the paper engine, exposed only through read-only inspection.
      PRAMANA_OMS_DB: ${PRAMANA_OMS_DB:-}
      PRAMANA_REVIEW_DIR: ${PRAMANA_REVIEW_DIR:-/data/reviews}
      PRAMANA_RESEARCH_REPORT: ${PRAMANA_RESEARCH_REPORT:-/data/research-report.json}
      PRAMANA_BENCHMARK_ATTRIBUTION_REPORT: ${PRAMANA_BENCHMARK_ATTRIBUTION_REPORT:-}
      PRAMANA_BENCHMARK_ATTRIBUTION_PORTFOLIO: ${PRAMANA_BENCHMARK_ATTRIBUTION_PORTFOLIO:-}
      PRAMANA_RESEARCH_LAB_REPORT: ${PRAMANA_RESEARCH_LAB_REPORT:-}
      PRAMANA_RESEARCH_DASHBOARD_SNAPSHOT: ${PRAMANA_RESEARCH_DASHBOARD_SNAPSHOT:-}
      PRAMANA_RUN_COMPARISON: ${PRAMANA_RUN_COMPARISON:-}
      PRAMANA_BROKER_JOURNAL: ${PRAMANA_BROKER_JOURNAL:-}
      PRAMANA_EXTERNAL_ACCOUNT_SNAPSHOT: ${PRAMANA_EXTERNAL_ACCOUNT_SNAPSHOT:-}
      PRAMANA_EXTERNAL_ACCOUNT_REF: ${PRAMANA_EXTERNAL_ACCOUNT_REF:-}
      PRAMANA_BROKER_OBSERVATION: ${PRAMANA_BROKER_OBSERVATION:-}
      PRAMANA_BROKER_ACCOUNT_REF: ${PRAMANA_BROKER_ACCOUNT_REF:-}
      PRAMANA_PORTFOLIO_RESEARCH_REPORT: ${PRAMANA_PORTFOLIO_RESEARCH_REPORT:-}
      PRAMANA_COMPANY_EVENTS_DB: ${PRAMANA_COMPANY_EVENTS_DB:-}
      PRAMANA_REVIEW_SECRET: ${PRAMANA_REVIEW_SECRET:-}
      PRAMANA_RELEASE_REVISION: ${PRAMANA_RELEASE_REVISION:-}
      PRAMANA_EXTERNAL_GATE_REPORT: ${PRAMANA_EXTERNAL_GATE_REPORT:-}
      PRAMANA_PORTFOLIO_RISK_METADATA_FILE: /data/portfolio-risk-metadata.json
      PRAMANA_INSTRUMENT_UNIVERSE_RECORDS: ${PRAMANA_INSTRUMENT_UNIVERSE_RECORDS:-/data/instrument-universe.normalized.json}
      PRAMANA_STRATEGY_CONFIG_SHA256: ${PRAMANA_STRATEGY_CONFIG_SHA256:-}
      PRAMANA_CHAT_MODEL: ${PRAMANA_CHAT_MODEL:-claude-sonnet-5}
      PRAMANA_CHAT_DAILY_LIMIT: ${PRAMANA_CHAT_DAILY_LIMIT:-200}
      PRAMANA_DECISION_QUALITY_REPORT: /data/decision-quality.json
      PRAMANA_POST_MORTEM_DIR: /data/post-mortems
      PRAMANA_DASHBOARD_SECRET: ${PRAMANA_DASHBOARD_SECRET:?required at least 32 characters}
      PRAMANA_PUBLIC_ORIGIN: ${PRAMANA_PUBLIC_ORIGIN:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - pramana-data:/data
      - type: bind
        source: ${PRAMANA_RISK_METADATA_HOST_FILE:-./portfolio-risk-metadata.example.json}
        target: /data/portfolio-risk-metadata.json
        read_only: true
        bind:
          create_host_path: false
    # `restart: unless-stopped` only reacts to the Node process exiting. A Next.js server
    # that is alive but no longer serving - an event loop wedged on a stuck handler, a
    # worker that never finished booting - keeps the container "up" and the console blank.
    # So probe the thing the service exists to do: answer on the port this file publishes
    # (`ports: 127.0.0.1:3000:3000`, container port 3000) with a real 200.
    # `/login` is the unauthenticated entry page and is the exact probe the containers CI
    # job already uses against this image (scripts/verify_pilot_containers.py, `ready()`),
    # so a build that passes CI passes this check for the same reason.
    # `node -e` rather than curl/wget: neither is in node:24-bookworm-slim, and the probe
    # is a short-lived process (~45 MB for a few hundred ms) well inside the 512m cap.
    # 127.0.0.1 rather than localhost: `next start --hostname 0.0.0.0` does not listen on
    # ::1, and Node resolves localhost verbatim, so the name can pick the address nothing
    # is bound to.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # `npm start` on a 2 GB instance needs well under a minute to accept connections;
      # until then a refused connection is expected and must not count as a failure.
      start_period: 60s
    mem_limit: 512m
    logging: *logging
  market-monitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "/app/scripts/market_monitor.py"]
    environment:
      <<: *shared
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:?required}
      # Missing/expired tokens reach the guarded boot and durable pre-open alert path.
      ZERODHA_ACCESS_TOKEN: ${ZERODHA_ACCESS_TOKEN:-}
      PRAMANA_ZERODHA_TOKEN_ISSUED_AT: ${PRAMANA_ZERODHA_TOKEN_ISSUED_AT:-}
      PRAMANA_ZERODHA_USER_ID: ${PRAMANA_ZERODHA_USER_ID:-}
      PRAMANA_HOLIDAYS_JSON: ${PRAMANA_HOLIDAYS_JSON:-}
      PRAMANA_MARKET_EXTRA_INSTRUMENTS_JSON: ${PRAMANA_MARKET_EXTRA_INSTRUMENTS_JSON:-}
      PRAMANA_ZERODHA_INSTRUMENTS_FILE: ${PRAMANA_ZERODHA_INSTRUMENTS_FILE:-}
      PRAMANA_ZERODHA_INSTRUMENTS_CACHE: ${PRAMANA_ZERODHA_INSTRUMENTS_CACHE:-/data/zerodha-instruments.json}
      # The monitor writes the provider tiles the dashboard shows, so it needs the same
      # provider configuration as the engine or the page reports a different build.
      FRED_API_KEY: ${FRED_API_KEY:-}
      PRAMANA_FUNDAMENTALS_PROVIDER: ${PRAMANA_FUNDAMENTALS_PROVIDER:-yahoo}
      PRAMANA_DAILY_HISTORY_PROVIDER: ${PRAMANA_DAILY_HISTORY_PROVIDER:-yahoo}
      PRAMANA_IBKR_ENABLED: "false"
    volumes: ["pramana-data:/data"]
    # 256m was sized when this service polled a dozen quotes. It now also loads the broker's
    # complete contract master, and on a ~110k-contract dump that peaks at 343 MB measured -
    # the raw list, a 28 MB JSON string for the cache and a second parsed list, all live at
    # once - so the kernel killed it (OOMKilled=true, exit 137) on every start, cache included.
    # 512m clears the measured peak with margin and still leaves the engine's 1g untouched on
    # a 4 GB host. The peak itself is the real defect: the summary needs counters and a small
    # sample, not three full copies. Bring this back down once that load is a single pass.
    mem_limit: 512m
    # The collector's job is one file: PRAMANA_MARKET_SNAPSHOT (/data/market-monitor.json),
    # rewritten every cycle by scripts/market_monitor.py. Checking that the process is
    # alive proves nothing - the loop's `except` clause publishes an `unavailable` payload
    # rather than dying, so a broker outage leaves a *running* process that keeps writing,
    # and only a genuinely wedged process stops the file from moving. Freshness is
    # therefore the only signal that separates the two, and it is exactly the failure the
    # dashboard cannot distinguish from a slow provider.
    #
    # Threshold. The loop's coded cadence is `time.sleep(60)` plus one collect(). One
    # collect() is bounded by its client timeouts - KiteConnect(timeout=15) for quotes,
    # profile and daily candles, and ResilientHttpClient (capped at 5s) for the RSS
    # fetch. The worst cycle is the first of a trading day, which adds the once-daily
    # kite.instruments() master (plus the ~110k-row parse this service was resized for)
    # and a daily-candle backfill for each of the 16 default rows, on top of the
    # per-key quote retry fan-out the batched call falls back to. At the full 15s
    # timeout for every one of those ~35 sequential requests that is roughly 9-10
    # minutes. 900s clears it with margin, and still catches a wedged collector inside a
    # quarter of one 09:15-15:30 session.
    #
    # This is deliberately NOT the dashboard's 120s bound (apps/pramana-ui/lib/market.ts
    # `collectorStale`, apps/pramana-ui/lib/freshness.ts). That one answers "may I show
    # this quote as current" and must be tight. This one answers "should this container be
    # replaced" and must not fire on the daily heavy cycle. Do not reconcile them.
    #
    # `find -newermt` rather than `stat`/`date` arithmetic keeps the probe free of `$`,
    # which Compose would otherwise interpolate, and free of a Python interpreter, which
    # would add ~20 MB inside the cap that a real OOM set. A missing file prints nothing
    # and fails, which is the correct answer before the first snapshot is written.
    healthcheck:
      test: ["CMD-SHELL", "find /data/market-monitor.json -newermt '900 seconds ago' | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      # A cold start writes nothing until its first collect() returns, and that is the
      # heavy cycle described above: the instrument master download and parse.
      start_period: 300s
    logging: *logging
  # Deliberately has no healthcheck, unlike every other service here. This is cron in a
  # sleep loop, not a server: scripts/scheduled_backup.py runs one cycle and then sleeps
  # PRAMANA_BACKUP_INTERVAL_SECONDS (86400 by default), so the only artifact it produces
  # appears once a day. A freshness check would have to allow a full interval plus the
  # 1800s backup subprocess timeout - about 25 hours - which means it would report
  # `healthy` for a day after the loop wedged. A green light that is a day stale is worse
  # than no light, because `docker compose ps` presents it as a live answer.
  # The failure it could catch is also one this service deliberately survives: `cycle()`
  # logs and continues, because a backup that cannot be taken must not take the service
  # down. Restarting the container would not empty a full disk or repair a corrupt ledger;
  # it would only reset the interval timer and re-run the same failing cycle. Backup
  # coverage is reviewed from /data/backups and its sha256 manifests (see
  # docs/VPS_GHOST_DEPLOYMENT.md), and one full cycle is verified end to end in CI by
  # scripts/verify_pilot_containers.py.
  # Daily consistent ledger backups without host cron: the same image, a sleep loop and
  # the existing pilot_ops backup (SQLite online backup API, integrity check, sha256
  # manifest). It reads the ledger through a read-only connection and never pauses the
  # engine. An on-instance backup is not a backup - copy /data/backups off the host too
  # (docs/VPS_GHOST_DEPLOYMENT.md).
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "/app/scripts/scheduled_backup.py"]
    command:
      - --database
      - /data/pramana.db
      - --directory
      - /data/backups
      - --interval-seconds
      - ${PRAMANA_BACKUP_INTERVAL_SECONDS:-86400}
      - --keep
      - ${PRAMANA_BACKUP_KEEP:-14}
    environment:
      <<: *shared
    volumes: ["pramana-data:/data"]
    mem_limit: 256m
    logging: *logging
  # Independent of daemon boot/health: a bad token must not suppress its own alert.
  token-watch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-m", "quant_ai.operations.zerodha_renewal", "watch"]
    environment:
      <<: *shared
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:?required}
      ZERODHA_ACCESS_TOKEN: ${ZERODHA_ACCESS_TOKEN:-}
      PRAMANA_ZERODHA_TOKEN_ISSUED_AT: ${PRAMANA_ZERODHA_TOKEN_ISSUED_AT:-}
      PRAMANA_ZERODHA_USER_ID: ${PRAMANA_ZERODHA_USER_ID:-}
      PRAMANA_ALERT_LOG: /data/alerts.jsonl
      PRAMANA_TELEGRAM_BOT_TOKEN: ${PRAMANA_TELEGRAM_BOT_TOKEN:-}
      PRAMANA_TELEGRAM_CHAT_ID: ${PRAMANA_TELEGRAM_CHAT_ID:-}
    volumes: ["pramana-data:/data"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "find /data/zerodha-watch.json -newermt '180 seconds ago' | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging
volumes:
  pramana-data:
