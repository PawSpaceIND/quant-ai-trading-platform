# Run: docker compose --env-file ../.env -f docker-compose.yml up -d --build
x-shared: &shared
  PRAMANA_TENANT_ID: ghost
  PRAMANA_LEDGER_PATH: /data/pramana.db
  PRAMANA_PROOF_DIR: /data/xai
  PRAMANA_HALT_FILE: /data/PRAMANA_HALT
  PRAMANA_MARKET_SNAPSHOT: /data/market-monitor.json
  TRADING_LIVE_MONEY_ACTIVE: "false"
# Container logs are capped so a chatty week cannot fill a small instance's disk and take
# the engine down with it. The engine's own alert log and proofs live in the volume.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
services:
  pramana-ghost:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      <<: *shared
      PRAMANA_PILOT_MODE: "true"
      PRAMANA_RELEASE_REVISION: ${PRAMANA_RELEASE_REVISION:-}
      PRAMANA_GHOST_LOG: /data/pramana-ghost.log
      PRAMANA_FOUNDER_DIRECTIVES_FILE: /app/directives.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:?required}
      ZERODHA_ACCESS_TOKEN: ${ZERODHA_ACCESS_TOKEN:?required}
      PRAMANA_ZERODHA_TOKENS_JSON: ${PRAMANA_ZERODHA_TOKENS_JSON:?required}
      PRAMANA_ZERODHA_SYMBOLS_JSON: ${PRAMANA_ZERODHA_SYMBOLS_JSON:?required}
      PRAMANA_TARGET_SYMBOL: ${PRAMANA_TARGET_SYMBOL:-INFY}
      PRAMANA_TARGET_MARKET: INDIA
      PRAMANA_TARGET_ASSET_CLASS: EQUITY
      PRAMANA_TARGET_CURRENCY: INR
      PRAMANA_TARGET_EXCHANGE: NSE
      PRAMANA_IBKR_ENABLED: "false"
      PRAMANA_NEWS_RSS_URLS: ${PRAMANA_NEWS_RSS_URLS:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      PRAMANA_FUNDAMENTALS_PROVIDER: ${PRAMANA_FUNDAMENTALS_PROVIDER:-yahoo}
      PRAMANA_AI_DAILY_CALL_LIMIT: ${PRAMANA_AI_DAILY_CALL_LIMIT:-500}
      PRAMANA_AI_DAILY_TOKEN_LIMIT: ${PRAMANA_AI_DAILY_TOKEN_LIMIT:-2000000}
      PRAMANA_AI_BUDGET_DB: /data/ai-budget.sqlite
      PRAMANA_DAILY_HISTORY_PROVIDER: ${PRAMANA_DAILY_HISTORY_PROVIDER:-yahoo}
      PRAMANA_DECISION_QUALITY_REPORT: /data/decision-quality.json
      PRAMANA_POST_MORTEM_DIR: /data/post-mortems
      PRAMANA_HOLIDAYS_JSON: ${PRAMANA_HOLIDAYS_JSON:-}
      # Every dispatched alert is appended to this file in the shared volume, so an alert
      # outlives the container that `up -d --build` replaces. Telegram is optional push
      # delivery on top; set both values in .env to enable it.
      PRAMANA_ALERT_LOG: /data/alerts.jsonl
      PRAMANA_TELEGRAM_BOT_TOKEN: ${PRAMANA_TELEGRAM_BOT_TOKEN:-}
      PRAMANA_TELEGRAM_CHAT_ID: ${PRAMANA_TELEGRAM_CHAT_ID:-}
    volumes:
      - pramana-data:/data
      - type: bind
        source: ${PRAMANA_DIRECTIVES_HOST_FILE:-./founder-directives.example.json}
        target: /app/directives.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "/app/scripts/pilot_ops.py", "health", "--database", "/data/pramana.db", "--tenant", "ghost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 45s
    # Sized for a small (2 GB) Lightsail instance and matched to the systemd unit's
    # MemoryMax. Caps are not reservations; the four services do not all peak together.
    mem_limit: 1g
    logging: *logging
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    restart: unless-stopped
    environment:
      <<: *shared
      PRAMANA_CONSOLE_DB: /data/pilot-console.sqlite
      PRAMANA_REVIEW_DIR: ${PRAMANA_REVIEW_DIR:-/data/reviews}
      PRAMANA_RESEARCH_REPORT: ${PRAMANA_RESEARCH_REPORT:-/data/research-report.json}
      PRAMANA_BENCHMARK_ATTRIBUTION_REPORT: ${PRAMANA_BENCHMARK_ATTRIBUTION_REPORT:-}
      PRAMANA_BENCHMARK_ATTRIBUTION_PORTFOLIO: ${PRAMANA_BENCHMARK_ATTRIBUTION_PORTFOLIO:-}
      PRAMANA_RESEARCH_LAB_REPORT: ${PRAMANA_RESEARCH_LAB_REPORT:-}
      PRAMANA_RESEARCH_DASHBOARD_SNAPSHOT: ${PRAMANA_RESEARCH_DASHBOARD_SNAPSHOT:-}
      PRAMANA_RUN_COMPARISON: ${PRAMANA_RUN_COMPARISON:-}
      PRAMANA_BROKER_JOURNAL: ${PRAMANA_BROKER_JOURNAL:-}
      PRAMANA_EXTERNAL_ACCOUNT_SNAPSHOT: ${PRAMANA_EXTERNAL_ACCOUNT_SNAPSHOT:-}
      PRAMANA_EXTERNAL_ACCOUNT_REF: ${PRAMANA_EXTERNAL_ACCOUNT_REF:-}
      PRAMANA_BROKER_OBSERVATION: ${PRAMANA_BROKER_OBSERVATION:-}
      PRAMANA_BROKER_ACCOUNT_REF: ${PRAMANA_BROKER_ACCOUNT_REF:-}
      PRAMANA_PORTFOLIO_RESEARCH_REPORT: ${PRAMANA_PORTFOLIO_RESEARCH_REPORT:-}
      PRAMANA_COMPANY_EVENTS_DB: ${PRAMANA_COMPANY_EVENTS_DB:-}
      PRAMANA_REVIEW_SECRET: ${PRAMANA_REVIEW_SECRET:-}
      PRAMANA_RELEASE_REVISION: ${PRAMANA_RELEASE_REVISION:-}
      PRAMANA_EXTERNAL_GATE_REPORT: ${PRAMANA_EXTERNAL_GATE_REPORT:-}
      PRAMANA_PORTFOLIO_RISK_METADATA_FILE: /data/portfolio-risk-metadata.json
      PRAMANA_INSTRUMENT_UNIVERSE_RECORDS: ${PRAMANA_INSTRUMENT_UNIVERSE_RECORDS:-/data/instrument-universe.normalized.json}
      PRAMANA_STRATEGY_CONFIG_SHA256: ${PRAMANA_STRATEGY_CONFIG_SHA256:-}
      PRAMANA_CHAT_MODEL: ${PRAMANA_CHAT_MODEL:-claude-sonnet-5}
      PRAMANA_CHAT_DAILY_LIMIT: ${PRAMANA_CHAT_DAILY_LIMIT:-200}
      PRAMANA_DECISION_QUALITY_REPORT: /data/decision-quality.json
      PRAMANA_POST_MORTEM_DIR: /data/post-mortems
      PRAMANA_DASHBOARD_SECRET: ${PRAMANA_DASHBOARD_SECRET:?required at least 32 characters}
      PRAMANA_PUBLIC_ORIGIN: ${PRAMANA_PUBLIC_ORIGIN:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - pramana-data:/data
      - type: bind
        source: ${PRAMANA_RISK_METADATA_HOST_FILE:-./portfolio-risk-metadata.example.json}
        target: /data/portfolio-risk-metadata.json
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 512m
    logging: *logging
  market-monitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "/app/scripts/market_monitor.py"]
    environment:
      <<: *shared
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:?required}
      ZERODHA_ACCESS_TOKEN: ${ZERODHA_ACCESS_TOKEN:?required}
      PRAMANA_HOLIDAYS_JSON: ${PRAMANA_HOLIDAYS_JSON:-}
      PRAMANA_MARKET_EXTRA_INSTRUMENTS_JSON: ${PRAMANA_MARKET_EXTRA_INSTRUMENTS_JSON:-}
      PRAMANA_ZERODHA_INSTRUMENTS_FILE: ${PRAMANA_ZERODHA_INSTRUMENTS_FILE:-}
      PRAMANA_ZERODHA_INSTRUMENTS_CACHE: ${PRAMANA_ZERODHA_INSTRUMENTS_CACHE:-/data/zerodha-instruments.json}
      # The monitor writes the provider tiles the dashboard shows, so it needs the same
      # provider configuration as the engine or the page reports a different build.
      FRED_API_KEY: ${FRED_API_KEY:-}
      PRAMANA_FUNDAMENTALS_PROVIDER: ${PRAMANA_FUNDAMENTALS_PROVIDER:-yahoo}
      PRAMANA_DAILY_HISTORY_PROVIDER: ${PRAMANA_DAILY_HISTORY_PROVIDER:-yahoo}
      PRAMANA_IBKR_ENABLED: "false"
    volumes: ["pramana-data:/data"]
    # 256m was sized when this service polled a dozen quotes. It now also loads the broker's
    # complete contract master, and on a ~110k-contract dump that peaks at 343 MB measured -
    # the raw list, a 28 MB JSON string for the cache and a second parsed list, all live at
    # once - so the kernel killed it (OOMKilled=true, exit 137) on every start, cache included.
    # 512m clears the measured peak with margin and still leaves the engine's 1g untouched on
    # a 4 GB host. The peak itself is the real defect: the summary needs counters and a small
    # sample, not three full copies. Bring this back down once that load is a single pass.
    mem_limit: 512m
    logging: *logging
  # Daily consistent ledger backups without host cron: the same image, a sleep loop and
  # the existing pilot_ops backup (SQLite online backup API, integrity check, sha256
  # manifest). It reads the ledger through a read-only connection and never pauses the
  # engine. An on-instance backup is not a backup - copy /data/backups off the host too
  # (docs/VPS_GHOST_DEPLOYMENT.md).
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "/app/scripts/scheduled_backup.py"]
    command:
      - --database
      - /data/pramana.db
      - --directory
      - /data/backups
      - --interval-seconds
      - ${PRAMANA_BACKUP_INTERVAL_SECONDS:-86400}
      - --keep
      - ${PRAMANA_BACKUP_KEEP:-14}
    environment:
      <<: *shared
    volumes: ["pramana-data:/data"]
    mem_limit: 256m
    logging: *logging
volumes:
  pramana-data:
